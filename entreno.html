<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #e8e9ec;
    --muted: #8a8f98;
    --accent: #4f9dff;
    --accent-dim: #2a4a70;
    --good: #4fd68c;
    --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
  }
  h1 { font-size: 1.3rem; margin: 8px 0 20px; }
  h2 { font-size: 1.1rem; margin: 0 0 4px; }
  .screen { display: none; }
  .screen.active { display: block; }

  .day-btn {
    width: 100%;
    padding: 18px;
    margin-bottom: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 1.05rem;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .day-btn:active { background: var(--accent-dim); }
  .day-btn .sub { color: var(--muted); font-size: 0.85rem; margin-top: 4px; display: block; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.95rem;
    padding: 8px 0;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .ex-name { font-size: 1.4rem; font-weight: 600; margin-bottom: 2px; }
  .ex-translation { color: var(--accent); font-size: 0.9rem; font-style: italic; margin-bottom: 8px; }
  .ex-progress { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }

  .counter-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin: 24px 0;
  }
  .counter-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1.6rem;
  }
  .counter-val { font-size: 2.6rem; font-weight: 700; min-width: 80px; text-align: center; }
  .counter-label { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: -12px; margin-bottom: 20px; }

  .weight-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 16px 0 24px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .weight-row select {
    width: 90px;
    text-align: center;
    text-align-last: center;
    font-size: 1.1rem;
    padding: 10px 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    appearance: none;
    -webkit-appearance: none;
  }

  .primary-btn {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .primary-btn:active { opacity: 0.85; }
  .secondary-btn {
    width: 100%;
    padding: 14px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 10px;
  }

  .series-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
  .dot.done { background: var(--good); }
  .dot.current { background: var(--accent); }

  .log-entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .log-date { color: var(--accent); font-size: 0.85rem; font-weight: 600; }
  .log-detail { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .summary-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .summary-item:last-child { border-bottom: none; }
  .empty-msg { color: var(--muted); text-align: center; padding: 40px 20px; }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    max-width: 340px;
    width: 100%;
  }
  .modal-box p { margin: 0 0 20px; font-size: 1rem; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; font-size: 0.95rem; border: 1px solid var(--border); }
  .modal-actions .confirm { background: var(--accent); color: #fff; border: none; }
  .modal-actions .cancel { background: none; color: var(--text); }

  .ex-list-item {
    width: 100%;
    padding: 16px;
    margin-bottom: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 1rem;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ex-list-item.completed {
    border-color: var(--good);
    background: rgba(79, 214, 140, 0.08);
  }
  .ex-list-item .ex-list-name { font-weight: 600; display: block; margin-bottom: 4px; }
  .ex-list-item .ex-list-sub { color: var(--muted); font-size: 0.85rem; }
  .check-mark { color: var(--good); font-size: 1.3rem; }

  .muscle-badge {
    display: inline-block;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    margin-left: 8px;
    vertical-align: middle;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .week-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .week-row.complete { border-color: var(--good); }
  .week-label { font-weight: 600; margin-bottom: 6px; }
  .week-days { color: var(--muted); font-size: 0.85rem; }
  .week-progress { display: flex; gap: 6px; margin-top: 8px; }
  .week-progress .pip { width: 18px; height: 18px; border-radius: 6px; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
  .week-progress .pip.done { background: var(--good); color: #06210f; font-weight: 700; }
  .week-progress .pip.missed { background: #e05a4f; color: #2b0a08; font-weight: 700; }

  .session-ex-list { display: flex; flex-direction: column; gap: 6px; }
  .session-ex-row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.85rem; }
  .session-ex-name { color: var(--text); flex-shrink: 0; }
  .session-ex-series { color: var(--muted); text-align: right; }

  .series-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .series-row:last-child { border-bottom: none; }
  .series-num { width: 22px; color: var(--muted); font-size: 0.9rem; flex-shrink: 0; }
  .series-row select {
    flex: 1;
    text-align: center;
    text-align-last: center;
    font-size: 1.05rem;
    padding: 10px 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    appearance: none;
    -webkit-appearance: none;
    min-width: 0;
  }
  .series-row .unit-label { color: var(--muted); font-size: 0.8rem; width: 30px; flex-shrink: 0; }
</style>
</head>
<body>

<div id="screen-home" class="screen active">
  <h1>Entrenamiento</h1>
  <button class="day-btn" onclick="startDay('A')">
    <span>Día A<span class="sub">Bíceps + Tríceps</span></span>
    <span>›</span>
  </button>
  <button class="day-btn" onclick="startDay('B')">
    <span>Día B<span class="sub">Espalda + Pecho</span></span>
    <span>›</span>
  </button>
  <button class="day-btn" onclick="startDay('C')">
    <span>Día C<span class="sub">Hombro + Pierna</span></span>
    <span>›</span>
  </button>
  <button class="link-btn" onclick="showCalendar()">Ver calendario</button>
</div>

<div id="screen-daylist" class="screen">
  <div class="top-bar">
    <button class="link-btn" onclick="goHome()">‹ Salir</button>
    <span id="daylist-title" style="color:var(--muted); font-size:0.9rem;"></span>
  </div>
  <div id="daylist-items"></div>
  <button class="primary-btn" id="finish-day-btn" onclick="finishSession()" style="display:none; margin-top:8px;">Finalizar sesión</button>
</div>

<div id="screen-workout" class="screen">
  <div class="top-bar">
    <button class="link-btn" onclick="backToDayList()">‹ Volver</button>
    <span id="day-title" style="color:var(--muted); font-size:0.9rem;"></span>
  </div>

  <div class="card">
    <div class="ex-name" id="ex-name"></div>
    <div class="ex-translation" id="ex-translation"></div>

    <div id="last-time-box" style="display:none; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:16px; font-size:0.85rem; color:var(--muted);">
      <strong style="color:var(--text);">Última vez:</strong> <span id="last-time-text"></span>
    </div>

    <div id="countdown-box" style="display:none; text-align:center; margin-bottom:20px;">
      <div id="countdown-val" style="font-size:3rem; font-weight:700;">--</div>
      <div class="weight-row" style="justify-content:center; margin:12px 0;">
        <span>Duración:</span>
        <select id="countdown-seconds-input"></select>
        <span>seg</span>
      </div>
      <button class="secondary-btn" id="countdown-btn" onclick="toggleCountdown()">Iniciar cuenta atrás</button>
    </div>

    <div id="series-rows"></div>

    <button class="primary-btn" onclick="finishExercise()" style="margin-top:8px;">Guardar y volver</button>
  </div>
</div>

<div id="screen-summary" class="screen">
  <h1>Sesión completada 💪</h1>
  <div class="card" id="summary-content"></div>
  <button class="primary-btn" onclick="goHome()">Volver al inicio</button>
</div>

<div id="screen-history" class="screen">
  <div class="top-bar">
    <button class="link-btn" onclick="goHome()">‹ Volver</button>
    <span style="color:var(--muted); font-size:0.9rem;">Historial</span>
  </div>
  <div id="history-list"></div>
</div>

<div id="screen-calendar" class="screen">
  <div class="top-bar">
    <button class="link-btn" onclick="goHome()">‹ Volver</button>
    <span style="color:var(--muted); font-size:0.9rem;">Calendario semanal</span>
  </div>
  <div id="calendar-list"></div>
</div>

<div class="modal-overlay" id="exit-modal">
  <div class="modal-box">
    <p>¿Salir sin guardar esta sesión?</p>
    <div class="modal-actions">
      <button class="cancel" onclick="cancelExit()">Cancelar</button>
      <button class="confirm" onclick="doExit()">Salir</button>
    </div>
  </div>
</div>

<script>
const PLAN = {
  A: {
    label: "Bíceps + Tríceps",
    exercises: [
      { id: "curl_biceps", name: "Curl bíceps", muscle: "Bíceps", reps: [16,14,12] },
      { id: "curl_martillo", name: "Curl martillo", muscle: "Bíceps", reps: [16,14,12] },
      { id: "triceps_kickback", name: "Triceps kickback", muscle: "Tríceps", reps: [12,12,12] },
      { id: "biceps_isometrico", name: "Isométrico de bíceps", muscle: "Bíceps", reps: [1,1,1], isTime: true },
      { id: "bench_dip", name: "Bench Dip", muscle: "Tríceps", reps: [16,14,12], noWeight: true },
    ]
  },
  B: {
    label: "Espalda + Pecho",
    exercises: [
      { id: "single_arm_row", name: "Single Arm Row", muscle: "Espalda", reps: [16,14,12] },
      { id: "incline_row", name: "Incline Row", muscle: "Espalda", reps: [16,14,12] },
      { id: "bench_press", name: "Bench Press", muscle: "Pecho", reps: [16,14,12] },
      { id: "incline_bench_press", name: "Incline Bench Press", muscle: "Pecho", reps: [16,14,12] },
    ]
  },
  C: {
    label: "Hombro + Pierna",
    exercises: [
      { id: "shoulder_press", name: "Shoulder Press", muscle: "Hombro", reps: [0,0,0] },
      { id: "lateral_raise", name: "Lateral Raise", muscle: "Hombro", reps: [0,0,0] },
    ]
  }
};

const SHEET_URL = "https://script.google.com/macros/s/AKfycby1WmtnP9GfvcMGbeu8mrHj4CTJ71gLec3WnuctIBabCApb5A4FnlgUnbVd2u-23SEr0A/exec";
const STORAGE_KEY = "entreno_historial";
const LASTWEIGHT_KEY = "entreno_pesos";
const LASTREPS_KEY = "entreno_reps";

let state = null;

function fetchHistoryFromSheet() {
  return fetch(SHEET_URL, { method: "GET" })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      const sessionsMap = {};
      rows.forEach(function(row) {
        if (row.Dia === "TEST") return;
        const key = row.Fecha + "|" + row.Dia;
        if (!sessionsMap[key]) {
          sessionsMap[key] = { date: row.Fecha, day: row.Dia, results: [] };
        }
        sessionsMap[key].results.push({
          exercise: row.Ejercicio,
          series: Number(row.Serie),
          reps: Number(row.Reps),
          weight: Number(row.Peso),
          isTime: false
        });
      });
      const sessions = Object.values(sessionsMap);
      sessions.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
      return sessions;
    });
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveHistory(history) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  } catch (e) {
    alert("No se pudo guardar el historial. Puede que el almacenamiento esté lleno o bloqueado.");
  }
}

function loadLastWeights() {
  try {
    const raw = localStorage.getItem(LASTWEIGHT_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function saveLastWeights(weights) {
  try {
    localStorage.setItem(LASTWEIGHT_KEY, JSON.stringify(weights));
  } catch (e) {}
}

function loadLastReps() {
  try {
    const raw = localStorage.getItem(LASTREPS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function saveLastReps(reps) {
  try {
    localStorage.setItem(LASTREPS_KEY, JSON.stringify(reps));
  } catch (e) {}
}

let wakeLock = null;

function requestWakeLock() {
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').then(function(lock) {
      wakeLock = lock;
    }).catch(function() {
      // Si falla (no soportado o denegado), la app sigue funcionando igual
    });
  }
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(function() {});
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', function() {
  if (wakeLock !== null && document.visibilityState === 'visible' && state !== null) {
    requestWakeLock();
  }
});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() {
  state = null;
  releaseWakeLock();
  showScreen('screen-home');
}

function startDay(day) {
  const plan = PLAN[day];
  if (!plan.exercises.length) {
    alert("Todavía no has definido los ejercicios del día " + day + ". Dímelos y los añadimos.");
    return;
  }
  requestWakeLock();
  state = {
    day: day,
    exIndex: null,
    seriesIndex: 0,
    sessionDate: new Date().toISOString(),
    completed: {},
    completedData: {},
    lastSessionData: {}
  };
  document.getElementById('daylist-title').textContent = "Día " + day + " · " + plan.label;
  document.getElementById('daylist-items').innerHTML = '<div class="empty-msg">Cargando historial...</div>';
  document.getElementById('finish-day-btn').style.display = 'none';
  showScreen('screen-daylist');

  fetchHistoryFromSheet().then(function(history) {
    const byExercise = {};
    history.forEach(function(session) {
      session.results.forEach(function(r) {
        if (!byExercise[r.exercise] || new Date(session.date) > new Date(byExercise[r.exercise].date)) {
          byExercise[r.exercise] = { date: session.date, entries: [] };
        }
      });
    });
    history.forEach(function(session) {
      session.results.forEach(function(r) {
        if (byExercise[r.exercise] && byExercise[r.exercise].date === session.date) {
          byExercise[r.exercise].entries.push(r);
        }
      });
    });
    Object.keys(byExercise).forEach(function(name) {
      const entries = byExercise[name].entries.sort((a, b) => a.series - b.series);
      state.lastSessionData[name] = entries.map(formatSeries).join(' · ');
    });

    // Marca en verde y precarga los ejercicios de este día ya hechos esta semana
    const currentWeekKey = getWeekKey(new Date());
    const thisWeekSessions = history.filter(function(s) {
      return s.day === day && getWeekKey(new Date(s.date)) === currentWeekKey;
    });

    console.log("DEBUG day:", day, "currentWeekKey:", currentWeekKey);

    thisWeekSessions.forEach(function(session) {
      session.results.forEach(function(r) {
        const ex = plan.exercises.find(function(e) { return e.name === r.exercise; });
        if (!ex) return;
        if (!state.completedData[ex.id]) state.completedData[ex.id] = [];
        state.completedData[ex.id][r.series - 1] = r;
        state.completed[ex.id] = true;
        state.completedData[ex.id + "_sent"] = true;
      });
      // Guarda la fecha de esa sesión existente para que la edición sobreescriba la fila correcta
      state.exerciseSessionDate = state.exerciseSessionDate || {};
      session.results.forEach(function(r) {
        const ex = plan.exercises.find(function(e) { return e.name === r.exercise; });
        if (ex) state.exerciseSessionDate[ex.id] = session.date;
      });
    });

    renderDayList();

    const debugEl = document.createElement('div');
    debugEl.style.cssText = "font-size:0.65rem; color:var(--muted); white-space:pre-wrap; padding:10px; background:var(--card); border-radius:8px; margin-top:10px;";
    debugEl.textContent = "DEBUG\nday=" + day + " weekKey=" + currentWeekKey +
      "\nhistory=" + JSON.stringify(history, null, 1) +
      "\nthisWeek=" + JSON.stringify(thisWeekSessions, null, 1);
    document.getElementById('daylist-items').appendChild(debugEl);
  }).catch(function(err) {
    renderDayList();
    console.error("Error al cargar historial:", err);
  });
}

function renderDayList() {
  const plan = PLAN[state.day];
  const container = document.getElementById('daylist-items');
  container.innerHTML = "";

  plan.exercises.forEach((ex, i) => {
    const done = !!state.completed[ex.id];
    const btn = document.createElement('button');
    btn.className = "ex-list-item" + (done ? " completed" : "");
    btn.onclick = () => openExercise(i);
    const subLine = (ex.translation ? ex.translation + ' · ' : '') + ex.reps.length + ' series';
    btn.innerHTML =
      '<span><span class="ex-list-name">' + ex.name + '<span class="muscle-badge">' + ex.muscle + '</span></span>' +
      '<span class="ex-list-sub">' + subLine + '</span></span>' +
      (done ? '<span class="check-mark">✓</span>' : '<span>›</span>');
    container.appendChild(btn);
  });

  const allDone = plan.exercises.every(ex => state.completed[ex.id]);
  document.getElementById('finish-day-btn').style.display = allDone ? 'block' : 'none';
}

function backToDayList() {
  renderDayList();
  showScreen('screen-daylist');
}

function openExercise(index) {
  state.exIndex = index;
  state.seriesIndex = 0;
  document.getElementById('day-title').textContent = "Día " + state.day + " · " + PLAN[state.day].label;
  showScreen('screen-workout');
  renderExercise();
}

function currentExercise() {
  return PLAN[state.day].exercises[state.exIndex];
}

const WEIGHT_OPTIONS = [5, 7, 8, 10, 15, 20];
const REPS_OPTIONS = Array.from({length: 25}, (_, i) => i + 1);
const SECONDS_OPTIONS = Array.from({length: 18}, (_, i) => (i + 1) * 5);

function populateSelect(selectEl, options, selectedValue) {
  selectEl.innerHTML = '<option value="">–</option>' +
    options.map(v => '<option value="' + v + '"' + (String(v) === String(selectedValue) ? ' selected' : '') + '>' + v + '</option>').join('');
}

let countdownTimer = null;
let countdownSeconds = 0;

function stopCountdown() {
  if (countdownTimer) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }
  const btn = document.getElementById('countdown-btn');
  if (btn) btn.textContent = "Iniciar cuenta atrás";
}

function toggleCountdown() {
  if (countdownTimer) {
    stopCountdown();
    return;
  }
  const secondsInput = document.getElementById('countdown-seconds-input');
  const chosen = parseInt(secondsInput.value);
  if (!chosen) {
    alert("Elige primero cuántos segundos quieres.");
    return;
  }
  countdownSeconds = chosen;
  const valEl = document.getElementById('countdown-val');
  const btn = document.getElementById('countdown-btn');
  valEl.textContent = countdownSeconds;
  btn.textContent = "Detener";

  countdownTimer = setInterval(function() {
    countdownSeconds--;
    valEl.textContent = countdownSeconds;
    if (countdownSeconds <= 0) {
      stopCountdown();
      valEl.textContent = "¡Listo!";
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }
  }, 1000);
}

function renderExercise() {
  const ex = currentExercise();

  document.getElementById('ex-name').innerHTML = ex.name + '<span class="muscle-badge">' + ex.muscle + '</span>';
  document.getElementById('ex-translation').textContent = ex.translation || '';

  document.getElementById('countdown-box').style.display = ex.isTime ? 'block' : 'none';
  stopCountdown();
  document.getElementById('countdown-val').textContent = '--';
  if (ex.isTime) {
    populateSelect(document.getElementById('countdown-seconds-input'), SECONDS_OPTIONS, '');
  }

  const lastBox = document.getElementById('last-time-box');
  const lastText = document.getElementById('last-time-text');
  if (state.lastSessionData && state.lastSessionData[ex.name]) {
    lastBox.style.display = 'block';
    lastText.textContent = state.lastSessionData[ex.name];
  } else {
    lastBox.style.display = 'none';
  }

  const savedResults = state.completedData[ex.id] || null;

  const rowsContainer = document.getElementById('series-rows');
  rowsContainer.innerHTML = "";

  ex.reps.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = "series-row";
    const repsLabel = ex.isTime ? 'seg' : 'reps';
    row.innerHTML =
      '<span class="series-num">S' + (i + 1) + '</span>' +
      (ex.noWeight ? '' :
        '<select id="weight-input-' + i + '"></select><span class="unit-label">kg</span>') +
      '<select id="reps-input-' + i + '"></select><span class="unit-label">' + repsLabel + '</span>';
    rowsContainer.appendChild(row);

    const savedRow = savedResults ? savedResults[i] : null;

    if (!ex.noWeight) {
      populateSelect(document.getElementById('weight-input-' + i), WEIGHT_OPTIONS, savedRow ? savedRow.weight : '');
    }
    populateSelect(document.getElementById('reps-input-' + i), ex.isTime ? SECONDS_OPTIONS : REPS_OPTIONS, savedRow ? savedRow.reps : '');
  });
}

function finishExercise() {
  const ex = currentExercise();
  const results = [];

  for (let i = 0; i < ex.reps.length; i++) {
    const weightRaw = ex.noWeight ? '0' : document.getElementById('weight-input-' + i).value;
    const repsRaw = document.getElementById('reps-input-' + i).value;

    if ((!ex.noWeight && weightRaw === '') || repsRaw === '') {
      alert("Faltan datos en la serie " + (i + 1) + ". Rellena peso y repeticiones en todas las series.");
      return;
    }

    results.push({
      exercise: ex.name,
      series: i + 1,
      reps: parseInt(repsRaw),
      weight: ex.noWeight ? 0 : parseFloat(weightRaw),
      isTime: !!ex.isTime
    });
  }

  state.completed[ex.id] = true;
  state.completedData[ex.id] = results;
  stopCountdown();

  const wasAlreadySent = !!state.completedData[ex.id + "_sent"];
  const oldDate = (state.exerciseSessionDate && state.exerciseSessionDate[ex.id]) || null;

  sendExerciseToSheet(ex.name, results, wasAlreadySent, oldDate);

  state.completedData[ex.id + "_sent"] = true;
  if (!state.exerciseSessionDate) state.exerciseSessionDate = {};
  state.exerciseSessionDate[ex.id] = state.sessionDate;

  backToDayList();
}


function sendExerciseToSheet(exerciseName, results, alreadySent, oldDate) {
  const rows = results.map(function(r) {
    return {
      fecha: state.sessionDate,
      dia: state.day,
      ejercicio: exerciseName,
      serie: r.series,
      reps: r.reps,
      peso: r.weight
    };
  });

  const body = { rows: rows };
  if (alreadySent && oldDate) {
    body.replaceKey = { fecha: oldDate, dia: state.day, ejercicio: exerciseName };
  }

  fetch(SHEET_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(body)
  }).catch(function(err) {
    console.error("Error al enviar a Google Sheets:", err);
  });
}

function finishSession() {
  const allResults = [];
  Object.keys(state.completedData).forEach(function(key) {
    if (key.endsWith("_sent")) return;
    allResults.push.apply(allResults, state.completedData[key]);
  });
  const session = { date: state.sessionDate, day: state.day, results: allResults };

  renderSummary(session);
  showScreen('screen-summary');
  releaseWakeLock();
  state = null;
}

function formatSeries(e) {
  const unit = e.isTime ? "s" : " reps";
  if (e.weight > 0) {
    return e.isTime ? (e.reps + "s x " + e.weight + "kg") : (e.reps + "x" + e.weight + "kg");
  }
  return e.reps + unit;
}

function renderSummary(session) {
  const container = document.getElementById('summary-content');
  container.innerHTML = "";

  const grouped = {};
  session.results.forEach(r => {
    if (!grouped[r.exercise]) grouped[r.exercise] = [];
    grouped[r.exercise].push(r);
  });

  Object.keys(grouped).forEach(name => {
    const entries = grouped[name];
    const seriesStr = entries.map(formatSeries).join(' · ');
    const div = document.createElement('div');
    div.className = "summary-item";
    div.innerHTML = "<span>" + name + "</span><span>" + seriesStr + "</span>";
    container.appendChild(div);
  });
}

function confirmExit() {
  document.getElementById('exit-modal').classList.add('active');
}

function cancelExit() {
  document.getElementById('exit-modal').classList.remove('active');
}

function doExit() {
  document.getElementById('exit-modal').classList.remove('active');
  state = null;
  goHome();
}

function showHistory() {
  const container = document.getElementById('history-list');
  container.innerHTML = '<div class="empty-msg">Cargando...</div>';
  showScreen('screen-history');

  fetchHistoryFromSheet().then(function(history) {
    container.innerHTML = "";

    if (!history.length) {
      container.innerHTML = '<div class="empty-msg">Todavía no hay sesiones registradas.</div>';
    } else {
      history.forEach(session => {
        const date = new Date(session.date);
        const dateStr = date.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
          " " + date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

        const div = document.createElement('div');
        div.className = "log-entry";
        div.innerHTML =
          '<div class="log-date">Día ' + session.day + ' — ' + dateStr + '</div>' +
          '<div class="log-detail">' + formatSessionDetail(session) + '</div>';
        container.appendChild(div);
      });
    }
  }).catch(function(err) {
    container.innerHTML = '<div class="empty-msg">Error al cargar desde Google Sheets: ' + err.message + '</div>';
  });
}
function getWeekKey(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const weekNum = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return d.getUTCFullYear() + "-W" + String(weekNum).padStart(2, '0');
}

function getWeekStart(date) {
  const d = new Date(date);
  const dayNum = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dayNum);
  d.setHours(0,0,0,0);
  return d;
}

function formatSessionDetail(session) {
  const grouped = {};
  session.results.forEach(r => {
    if (!grouped[r.exercise]) grouped[r.exercise] = [];
    grouped[r.exercise].push(r);
  });
  return '<div class="session-ex-list">' + Object.keys(grouped).map(name => {
    const entries = grouped[name];
    const seriesStr = entries.map(formatSeries).join(' · ');
    return '<div class="session-ex-row"><span class="session-ex-name">' + name + '</span>' +
      '<span class="session-ex-series">' + seriesStr + '</span></div>';
  }).join('') + '</div>';
}

function showCalendar() {
  const container = document.getElementById('calendar-list');
  container.innerHTML = '<div class="empty-msg">Cargando...</div>';
  showScreen('screen-calendar');

  fetchHistoryFromSheet().then(function(history) {
    container.innerHTML = "";

    if (!history.length) {
      container.innerHTML = '<div class="empty-msg">Todavía no hay sesiones registradas.</div>';
      return;
    }

    const weeks = {};
    history.forEach(session => {
      const date = new Date(session.date);
      const key = getWeekKey(date);
      if (!weeks[key]) {
        weeks[key] = { start: getWeekStart(date), days: new Set(), sessions: [] };
      }
      weeks[key].days.add(session.day);
      weeks[key].sessions.push(session);
    });

    const sortedKeys = Object.keys(weeks).sort().reverse();

    sortedKeys.forEach((key, wi) => {
      const week = weeks[key];
      const daysArr = ['A', 'B', 'C'];
      const count = week.days.size;
      const complete = count >= 3;

      const endDate = new Date(week.start);
      endDate.setDate(endDate.getDate() + 6);
      const weekIsOver = endDate < new Date();
      const label = week.start.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }) +
        " – " + endDate.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });

      const div = document.createElement('div');
      div.className = "week-row" + (complete ? " complete" : "");
      div.style.cursor = "pointer";

      const detailId = "week-detail-" + wi;
      div.innerHTML =
        '<div class="week-label">' + label + '</div>' +
        '<div class="week-days">' + count + ' de 3 días completados · toca para ver detalle</div>' +
        '<div class="week-progress">' +
        daysArr.map(d => {
          const hasIt = week.days.has(d);
          const cls = hasIt ? ' done' : (weekIsOver ? ' missed' : '');
          return '<div class="pip' + cls + '">' + d + '</div>';
        }).join('') +
        '</div>' +
        '<div id="' + detailId + '" style="display:none; margin-top:12px;"></div>';

      div.onclick = () => {
        const detailEl = document.getElementById(detailId);
        if (detailEl.style.display === 'none') {
          detailEl.style.display = 'block';
          detailEl.innerHTML = week.sessions
            .sort((a, b) => new Date(b.date) - new Date(a.date))
            .map(s => {
              const d = new Date(s.date);
              const dateStr = d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }) +
                " " + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
              return '<div class="log-entry"><div class="log-date">Día ' + s.day + ' — ' + dateStr + '</div>' +
                '<div class="log-detail">' + formatSessionDetail(s) + '</div></div>';
            }).join('');
        } else {
          detailEl.style.display = 'none';
        }
      };

      container.appendChild(div);
    });
  }).catch(function(err) {
    container.innerHTML = '<div class="empty-msg">Error al cargar desde Google Sheets: ' + err.message + '</div>';
  });
}
</script>
